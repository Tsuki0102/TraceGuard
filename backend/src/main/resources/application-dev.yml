server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: traceguard
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:traceguard}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # SEC-15：dev 本地默认保留开发账号，生产/容器环境必须经 MYSQL_USER/MYSQL_PASSWORD 注入
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:sql/init.sql

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.traceguard.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

traceguard:
  jwt:
    # dev 本地开发默认值（ConfigAuditor 会 WARN）；可通过环境变量 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:TraceGuard-JWT-Secret-Key-2026-For-Requirement-Code-Consistency-System-Must-Be-Long}
    expire-hours: 72
  storage:
    upload-path: ./uploads/
    backup-path: ./backups/
  analysis:
    default-threshold-t1: 0.8
    default-threshold-t2: 0.5
    default-weight-alpha: 0.4
    default-weight-beta: 0.35
    default-weight-gamma: 0.25
    # FR-REQ-004：形式化规约校验失败是否阻断后续分析流程（简化校验器存在误报，默认关闭）
    strict-spec-verify: false
  mysql:
    database: traceguard
    bin-path: D:/Develop/MySQL/MySQL Server 8.0/bin
  # GAP-002：Alloy 真实语义求解
  alloy:
    enabled: true
    timeout-seconds: 30
    max-instances: 5
    max-scope: 6
  # GAP-003：Soot 字节码级 CFG
  soot:
    enabled: true
    compile-timeout-seconds: 60
    method-cfg-timeout-seconds: 10
  # GAP-021：大模型编排（默认关闭，配置密钥并开启后生效）
  llm:
    enabled: false
    providers:
      deepseek:
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY:}
        timeout-seconds: 60
      glm:
        base-url: https://open.bigmodel.cn/api/paas/v4
        api-key: ${GLM_API_KEY:}
        timeout-seconds: 60
      local:
        base-url: http://localhost:8000
        api-key: ""
        timeout-seconds: 120
      qwen:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${QWEN_API_KEY:}
        timeout-seconds: 60
    routing:
      requirement: glm
      alloy: deepseek
      code-explain: deepseek
      defect-explain: deepseek
      consistency-check: qwen
    models:
      requirement: glm-5.3
      alloy: deepseek-v4-flash
      code-explain: deepseek-v4-flash
      defect-explain: deepseek-v4-flash
      consistency-check: qwen3.5-flash-2026-02-23
    max-concurrent-calls: 4
    max-calls-per-stage: 200
    config-encrypt-key: ${LLM_CONFIG_KEY:TraceGuard#2026!LlmConfigSecret}

knife4j:
  enable: true
  setting:
    language: zh_cn
