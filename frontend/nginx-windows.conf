# AUD-12：Windows 原生部署专用 nginx 配置（自包含：不依赖 nginx 安装目录的 mime.types）。
# 由 start-frontend.bat 调用，-p 指向 frontend/ 目录，root 相对该目录解析到 dist/：
#   nginx -c "frontend\nginx-windows.conf" -p "frontend"
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # 自包含 MIME 映射（前端构建产物常用类型）
    # 使用 types 块直接生效，而非 map 变量
    types {
        text/html              html;
        application/javascript js;
        text/css               css;
        application/json       json;
        image/svg+xml          svg;
        image/png              png;
        image/jpeg             jpg jpeg;
        image/gif              gif;
        image/x-icon           ico;
        font/woff2             woff2;
        font/ttf               ttf;
    }

    server {
        listen       80;
        server_name  localhost;

        # 前端静态资源（Vue3 SPA history 路由）；root 相对 -p 前缀（frontend/）解析到 dist/
        root   dist;
        index  index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 后端 API 反向代理
        location /api/ {
            proxy_pass http://localhost:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 200m;
        }

        # WebSocket 进度推送
        location /api/ws/ {
            proxy_pass http://localhost:8080/api/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }
    }
}
